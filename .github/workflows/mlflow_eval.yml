name: LLMOps RAG Evaluation

on:
  schedule:
    - cron: '0 2 * * *' # Run automatically at 2:00 AM every night
  workflow_dispatch: # Allow manual triggering from the GitHub UI

jobs:
  evaluate-rag:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run RAG Evaluation (MLflow)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # If using OpenAI for the true LLM evaluator, add the secret here:
        # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python scripts/evaluate_rag.py
        
    - name: Upload MLflow tracking data
      uses: actions/upload-artifact@v4
      with:
        name: mlflow-database
        path: mlflow.db
        retention-days: 7
